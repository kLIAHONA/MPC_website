<!--SCRIPT FOR POP UP MENU-->
<script>
document.addEventListener("DOMContentLoaded", function () {
    const menuBtn = document.getElementById("menu_btn");
    const mobileMenu = document.getElementById("mobile_menu");

    menuBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        mobileMenu.classList.toggle("open");
    });

    document.addEventListener("click", (e) => {
        if (!mobileMenu.contains(e.target) && e.target !== menuBtn) {
            mobileMenu.classList.remove("open");
        }
    });
});
</script>
<!--SCRIPT FOR HEADER CAROUSEL SLIDE-->
<script>
document.addEventListener("DOMContentLoaded", () => {

  const track = document.querySelector(".header_carousel_track");
  const slides = document.querySelectorAll(".header_carousel_content");
  const dots = document.querySelectorAll(".carousel_dot");

  if (!track || slides.length === 0) return;

  const firstClone = slides[0].cloneNode(true);
  track.appendChild(firstClone);

  let currentIndex = 0;
  const totalSlides = slides.length;

  function updateDots(index) {
    dots.forEach(dot => dot.classList.remove("active"));
    dots[index].classList.add("active");
  }

  function goToSlide(index) {
    currentIndex = index;
    track.style.transition = "transform 0.5s ease-in-out";
    track.style.transform = `translateX(-${currentIndex * 100}%)`;
    updateDots(currentIndex);
  }

  function nextSlide() {
    currentIndex++;
    track.style.transition = "transform 0.5s ease-in-out";
    track.style.transform = `translateX(-${currentIndex * 100}%)`;

    if (currentIndex === totalSlides) {
      setTimeout(() => {
        track.style.transition = "none";
        currentIndex = 0;
        track.style.transform = "translateX(0%)";
      }, 500);
    }

    updateDots(currentIndex % totalSlides);
  }

  // Auto slide
  setInterval(nextSlide, 3000);

  // Dot click navigation
  dots.forEach((dot, index) => {
    dot.addEventListener("click", () => {
      goToSlide(index);
    });
  });

});
</script>
<!--SCRIPT FOR CAROUSEL BUTTONS-->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.carousel').forEach(carousel => {
            const items = carousel.querySelectorAll('.carousel_content');
            if (!items || items.length === 0) return;

            const buttonsHtml = Array.from(items, () => '<button type="button" class="carousel_button" aria-label="carousel control"></button>');

            carousel.insertAdjacentHTML('beforeend', `
                <div class="carousel_nav">
                    ${buttonsHtml.join('')}
                </div>
            `);

            const buttons = carousel.querySelectorAll('.carousel_button');
            if (!buttons || buttons.length === 0) return;
            let currentIndex = 0;

            const setActive = (index) => {
                const i = ((index % items.length) + items.length) % items.length;
                items.forEach(item => item.classList.remove('carousel_content-active'));
                buttons.forEach(btn => btn.classList.remove('carousel_button-active'));
                items[i].classList.add('carousel_content-active');
                buttons[i].classList.add('carousel_button-active');
                currentIndex = i;
            };

            buttons.forEach((button, i) => {
                button.addEventListener('click', () => setActive(i));
            });

            const prevBtn = carousel.querySelector('.prev_btn');
            const nextBtn = carousel.querySelector('.next_btn');
            if (prevBtn) prevBtn.addEventListener('click', () => setActive(currentIndex - 1));
            if (nextBtn) nextBtn.addEventListener('click', () => setActive(currentIndex + 1));

            setActive(0);
        });
    });
</script>
<!--SCRIPT FOR CAROUSEL ARROWS-->
<script>
    const nextImg = document.getElementById('next_btn');
    const prevImg = document.getElementById('prev_btn');
    
    const nextButton = nextImg ? nextImg.closest('.carousel_btn') || nextImg.parentElement : null;
    const prevButton = prevImg ? prevImg.closest('.carousel_btn') || prevImg.parentElement : null;
    
    function addPressed(el) { if (el) el.classList.add('pressed'); }
    function removePressed(el) { if (el) el.classList.remove('pressed'); }
    
    function attachPressListeners(el) {
        if (!el) return;
        
        el.addEventListener('pointerdown', () => addPressed(el));
        el.addEventListener('pointerup', () => removePressed(el));
        el.addEventListener('pointercancel', () => removePressed(el));
        el.addEventListener('pointerleave', () => removePressed(el));
        
        el.addEventListener('touchstart', () => addPressed(el), {passive: true});
        el.addEventListener('touchend', () => removePressed(el));
    }
    
    attachPressListeners(nextButton);
    attachPressListeners(prevButton);
</script>
